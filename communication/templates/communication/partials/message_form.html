<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box modal-box-lg">
    <div class="modal-header">
      <span class="modal-title">Nouveau message au parent</span>
      <button onclick="document.getElementById('modal-overlay').remove()" class="btn-icon" aria-label="Fermer">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form hx-post="{% url 'communication:message_create' %}"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          hx-target="#modal-container"
          hx-swap="innerHTML">
      {% csrf_token %}
      <div class="modal-body">
        {% if error %}
        <div class="alert alert-danger mb-4">{{ error }}</div>
        {% endif %}

        <div class="form-grid-2">
          <div class="form-group">
            <label class="input-label">Élève <span class="text-danger">*</span></label>
            <select name="eleve" required class="input select">
              <option value="">— Choisir un élève —</option>
              {% for eleve in eleves %}
              <option value="{{ eleve.pk }}">{{ eleve.nom }} {{ eleve.prenom }} ({{ eleve.matricule }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="input-label">Type de message <span class="text-danger">*</span></label>
            <select name="type" required class="input select">
              <option value="">— Choisir un type —</option>
              {% for val, label in type_choices %}
              <option value="{{ val }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="input-label">Objet <span class="text-danger">*</span></label>
          <input type="text" name="objet" required class="input"
                 placeholder="Ex : Convocation pour entretien disciplinaire">
        </div>

        <div class="form-group">
          <label class="input-label">Contenu <span class="text-danger">*</span></label>
          <textarea name="contenu" rows="4" required class="input"
                    placeholder="Rédigez votre message ici…"></textarea>
        </div>

        <div class="form-group">
          <label class="input-label">
            Créneaux proposés
            <span class="text-muted text-sm">(pour convocations — un créneau par ligne)</span>
          </label>
          <textarea name="creneaux" rows="3" class="input"
                    placeholder="Lundi 12 mai à 10h00&#10;Mardi 13 mai à 14h30&#10;Mercredi 14 mai à 08h00"></textarea>
        </div>

        <label class="d-flex align-center gap-3">
          <input type="checkbox" name="envoyer_sms" class="input-checkbox">
          <span class="text-sm text-secondary">Envoyer un SMS avec le lien de réponse</span>
        </label>

        <div class="modal-footer">
          <button type="button" onclick="document.getElementById('modal-overlay').remove()" class="btn-secondary">Annuler</button>
          <button type="submit" class="btn-primary">Envoyer</button>
        </div>
      </div>
    </form>
  </div>
</div>
