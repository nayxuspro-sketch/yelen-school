{% extends 'core/base.html' %}

{% block title %}Classes — Paramètres{% endblock %}

{% block content %}
<div class="page-header animate-fade-up">
    <div>
        <p class="page-subtitle">
            <a href="{% url 'parametres:index' %}" class="text-secondary">Paramètres</a>
            <span class="text-muted"> / </span>
            <span>Classes</span>
        </p>
        <h1 class="page-title">Classes</h1>
    </div>
    <button hx-get="{% url 'parametres:classe_create' %}" hx-target="#modal-container" hx-swap="innerHTML"
        class="btn-primary">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Nouvelle classe
    </button>
</div>

<div id="modal-container"></div>

<div class="card mb-4" style="padding:var(--space-4);">
  <div class="search-wrapper">
    <span class="search-icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
    </span>
    <input type="text" name="q" class="input search-input"
           placeholder="Rechercher par nom ou cycle…"
           value="{{ query }}"
           hx-get="{% url 'parametres:classe_list' %}"
           hx-trigger="keyup changed delay:400ms"
           hx-target="#classe-list-container"
           hx-push-url="true">
  </div>
</div>

<div id="classe-list-container" class="animate-fade-up delay-1">
    {% include 'parametres/partials/classe_list.html' %}
</div>
{% endblock %}
