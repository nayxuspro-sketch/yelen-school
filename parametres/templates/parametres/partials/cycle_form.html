<div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title">{% if cycle %}Modifier le cycle{% else %}Nouveau cycle{% endif %}</span>
            <button onclick="document.getElementById('modal-overlay').remove()" class="btn-icon" aria-label="Fermer">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <form hx-post="{% if cycle %}{% url 'parametres:cycle_edit' cycle.pk %}{% else %}{% url 'parametres:cycle_create' %}{% endif %}"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              hx-target="#modal-container"
              hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                {% if error %}<div class="alert alert-danger mb-4">{{ error }}</div>{% endif %}

                <div class="form-group">
                    <label class="input-label">Nom <span style="color:#FF6B7A;">*</span></label>
                    <input type="text" name="nom" value="{{ cycle.nom|default:'' }}" placeholder="Ex: Secondaire" required class="input">
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="input-label">Code <span style="color:#FF6B7A;">*</span></label>
                        <select name="code" required class="input select">
                            {% for val, label in code_choices %}
                            <option value="{{ val }}" {% if cycle.code == val %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="input-label">Ordre</label>
                        <input type="number" name="ordre" value="{{ cycle.ordre|default:1 }}" min="1" max="10" class="input">
                    </div>
                </div>

                <div class="form-group">
                    <label class="input-label">Description</label>
                    <textarea name="description" rows="2" placeholder="Description optionnelle..."
                        class="input" style="resize:none;">{{ cycle.description|default:'' }}</textarea>
                </div>

                {% if cycle %}
                <label class="d-flex align-center gap-3" style="cursor:pointer;">
                    <input type="checkbox" name="actif" {% if cycle.actif %}checked{% endif %}
                        style="width:1rem; height:1rem; accent-color:var(--color-primary);">
                    <span class="text-sm text-secondary">Cycle actif</span>
                </label>
                {% endif %}

                <div class="modal-footer">
                    <button type="button" onclick="document.getElementById('modal-overlay').remove()" class="btn-secondary">Annuler</button>
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </div>
            </div>
        </form>
    </div>
</div>
