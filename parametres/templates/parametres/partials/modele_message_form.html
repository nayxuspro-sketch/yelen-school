<form method="post" action="{% url 'parametres:modele_message_form' type_msg=type_msg %}"
      style="border-top:1px solid var(--color-border); padding-top:var(--space-4);">
  {% csrf_token %}
  <div style="margin-bottom:var(--space-3);">
    <label class="input-label" for="contenu-{{ type_msg }}">
      Contenu du message
      <span style="font-size:0.72rem; color:var(--color-text-muted); font-weight:400; margin-left:var(--space-2);">
        (<span id="count-{{ type_msg }}">0</span> / 160 caractères)
      </span>
    </label>
    <textarea
      id="contenu-{{ type_msg }}"
      name="contenu_sms"
      rows="4"
      class="input"
      style="width:100%; resize:vertical; font-family:inherit;"
      maxlength="320"
      oninput="document.getElementById('count-{{ type_msg }}').textContent=this.value.length"
      >{{ modele.contenu_sms|default:defaut }}</textarea>
    <p style="font-size:0.75rem; color:var(--color-text-muted); margin-top:var(--space-2);">
      Variables disponibles :
      {% for v in variables %}
      <code style="font-size:0.72rem; background:rgba(99,102,241,0.08); color:#6366f1; padding:1px 6px; border-radius:3px; cursor:pointer;"
            onclick="insertVariable('contenu-{{ type_msg }}', '{{ v }}')">{{ v }}</code>
      {% endfor %}
    </p>
  </div>

  <div style="display:flex; align-items:center; gap:var(--space-4); margin-bottom:var(--space-4);">
    <label style="display:flex; align-items:center; gap:var(--space-2); cursor:pointer; font-size:0.875rem;">
      <input type="checkbox" name="actif" {% if modele.actif or not modele %}checked{% endif %}
             style="width:16px; height:16px; accent-color:var(--color-primary);">
      Activer ce modèle personnalisé
    </label>
  </div>

  <div style="display:flex; gap:var(--space-3);">
    <button type="submit" class="btn-primary" style="font-size:0.85rem;">Enregistrer</button>
    <button type="button" class="btn-outline" style="font-size:0.85rem;"
            onclick="document.getElementById('form-{{ type_msg }}').innerHTML=''">Annuler</button>
  </div>
</form>

<script>
(function() {
  var el = document.getElementById('contenu-{{ type_msg }}');
  if (el) document.getElementById('count-{{ type_msg }}').textContent = el.value.length;
})();

function insertVariable(fieldId, variable) {
  var el = document.getElementById(fieldId);
  if (!el) return;
  var start = el.selectionStart, end = el.selectionEnd;
  el.value = el.value.substring(0, start) + variable + el.value.substring(end);
  el.selectionStart = el.selectionEnd = start + variable.length;
  el.focus();
  document.getElementById('count-' + fieldId.replace('contenu-', '')).textContent = el.value.length;
}
</script>
