<div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title">{% if statut %}Modifier le statut{% else %}Nouveau statut{% endif %}</span>
            <button data-csp-remove="modal-overlay" class="btn-icon" aria-label="Fermer">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <form hx-post="{% if statut %}{% url 'parametres:statut_edit' statut.pk %}{% else %}{% url 'parametres:statut_create' %}{% endif %}"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              hx-target="#modal-container"
              hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                {% if error %}<div class="alert alert-danger mb-4">{{ error }}</div>{% endif %}

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="input-label">Nom <span style="color:#FF6B7A;">*</span></label>
                        <input type="text" name="nom" value="{{ statut.nom|default:'' }}" placeholder="Ex: Affecté" required class="input">
                    </div>
                    <div class="form-group">
                        <label class="input-label">Code <span style="color:#FF6B7A;">*</span></label>
                        <input type="text" name="code" value="{{ statut.code|default:'' }}" placeholder="Ex: AFF" required class="input">
                    </div>
                </div>

                <div class="form-group">
                    <label class="input-label">Description</label>
                    <textarea name="description" rows="2" class="input" style="resize:none;">{{ statut.description|default:'' }}</textarea>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="input-label">Couleur</label>
                        <div class="d-flex align-center gap-2">
                            <input type="color" name="couleur" value="{{ statut.couleur|default:'#00A86B' }}" id="couleur-picker"
                                style="width:2.5rem; height:2.25rem; border-radius:var(--radius-sm); border:1px solid var(--color-border); background:var(--color-bg-input); cursor:pointer; padding:2px;"
                                data-csp-sync-target="couleur-text">
                            <input type="text" id="couleur-text" value="{{ statut.couleur|default:'#00A86B' }}"
                                class="input text-mono flex-1"
                                data-csp-sync-target="couleur-picker">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="input-label">Ordre</label>
                        <input type="number" name="ordre" value="{{ statut.ordre|default:1 }}" min="1" class="input">
                    </div>
                </div>

                {% if statut %}
                <label class="d-flex align-center gap-3" style="cursor:pointer;">
                    <input type="checkbox" name="actif" {% if statut.actif %}checked{% endif %}
                        style="width:1rem; height:1rem; accent-color:var(--color-primary);">
                    <span class="text-sm text-secondary">Statut actif</span>
                </label>
                {% endif %}

                <div class="modal-footer">
                    <button type="button" data-csp-remove="modal-overlay" class="btn-secondary">Annuler</button>
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </div>
            </div>
        </form>
    </div>
</div>
