<div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title">{% if appr %}Modifier l'appréciation{% else %}Nouvelle appréciation{% endif %}</span>
            <button data-csp-remove="modal-overlay" class="btn-icon" aria-label="Fermer">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <form hx-post="{% if appr %}{% url 'parametres:appreciation_primaire_edit' appr.pk %}{% else %}{% url 'parametres:appreciation_primaire_create' %}{% endif %}"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              hx-target="#modal-container"
              hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                {% if error %}<div class="alert alert-danger mb-4">{{ error }}</div>{% endif %}

                <div class="form-group">
                    <label class="input-label">Libellé <span style="color:#FF6B7A;">*</span></label>
                    <input type="text" name="libelle" value="{{ appr.libelle|default:'' }}" placeholder="Ex: Excellent" required class="input">
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="input-label">Moy min (sur 10) <span style="color:#FF6B7A;">*</span></label>
                        <input type="number" name="moy_min" value="{{ appr.moy_min|default:0 }}" min="0" max="10" step="0.5" required class="input">
                    </div>
                    <div class="form-group">
                        <label class="input-label">Moy max (sur 10) <span style="color:#FF6B7A;">*</span></label>
                        <input type="number" name="moy_max" value="{{ appr.moy_max|default:10 }}" min="0" max="10" step="0.5" required class="input">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="input-label">Couleur</label>
                        <div class="d-flex align-center gap-2">
                            <input type="color" name="couleur" value="{{ appr.couleur|default:'#00A86B' }}" id="appr-color"
                                style="width:2.5rem; height:2.25rem; border-radius:var(--radius-sm); border:1px solid var(--color-border); background:var(--color-bg-input); cursor:pointer; padding:2px;">
                            <span class="text-xs text-mono text-muted" id="appr-color-label">{{ appr.couleur|default:'#00A86B' }}</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="input-label">Ordre</label>
                        <input type="number" name="ordre" value="{{ appr.ordre|default:1 }}" min="1" class="input">
                    </div>
                </div>

                {% if appr %}
                <label class="d-flex align-center gap-3" style="cursor:pointer;">
                    <input type="checkbox" name="actif" {% if appr.actif %}checked{% endif %} style="width:1rem; height:1rem; accent-color:var(--color-primary);">
                    <span class="text-sm text-secondary">Appréciation active</span>
                </label>
                {% endif %}

                <div class="modal-footer">
                    <button type="button" data-csp-remove="modal-overlay" class="btn-secondary">Annuler</button>
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </div>
            </div>
        </form>
    </div>
</div>
<script>
    document.getElementById('appr-color').addEventListener('input', function() {
        document.getElementById('appr-color-label').textContent = this.value;
    });
</script>
