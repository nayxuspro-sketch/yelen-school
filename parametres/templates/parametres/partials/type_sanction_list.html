<div id="liste-container" hx-trigger="parametreUpdated from:body" hx-get="{% url 'parametres:type_sanction_list' %}" hx-target="#liste-container" hx-swap="outerHTML">
    <div class="table-scroll">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Libellé</th>
                    <th>Description</th>
                    <th>Statut</th>
                    <th style="text-align:right;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for ts in types_sanctions %}
                <tr>
                    <td class="text-mono fw-bold">{{ ts.code }}</td>
                    <td class="fw-medium">{{ ts.libelle }}</td>
                    <td class="text-secondary">{{ ts.description|truncatechars:50 }}</td>
                    <td>
                        {% if ts.actif %}
                        <span class="badge" style="background:#00A86B20; color:#00A86B;">Actif</span>
                        {% else %}
                        <span class="badge" style="background:#FF6B7A20; color:#FF6B7A;">Inactif</span>
                        {% endif %}
                    </td>
                    <td style="text-align:right;">
                        <div class="d-flex justify-end gap-2">
                            <button hx-get="{% url 'parametres:type_sanction_edit' ts.pk %}" hx-target="#modal-container" hx-swap="innerHTML"
                                class="btn-icon" title="Modifier">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                            <button hx-post="{% url 'parametres:type_sanction_delete' ts.pk %}"
                                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                                hx-confirm="Supprimer ce type de sanction ?"
                                class="btn-icon" title="Supprimer" style="color:var(--color-danger);">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="5"><div class="empty-state"><p class="empty-state-text">Aucun type de sanction. Créez le premier.</p></div></td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
