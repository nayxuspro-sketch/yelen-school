<div id="modal-overlay" class="modal-overlay">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
            <span class="modal-title" id="modal-title">{% if type_doc %}Modifier le type de document{% else %}Nouveau type de document{% endif %}</span>
            <button data-csp-remove="modal-overlay" class="btn-icon" aria-label="Fermer">
                <svg aria-hidden="true" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <form hx-post="{% if type_doc %}{% url 'parametres:type_document_edit' type_doc.pk %}{% else %}{% url 'parametres:type_document_create' %}{% endif %}"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              hx-target="#modal-container"
              hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                {% if error %}<div class="alert alert-danger mb-4">{{ error }}</div>{% endif %}

                <div class="form-group">
                    <label class="input-label" for="id_code">Code <span style="color:#FF6B7A;">*</span></label>
                    <input type="text" name="code" value="{{ type_doc.code|default:'' }}" placeholder="Ex: CERT_SCOL" required class="input" id="id_code">
                </div>

                <div class="form-group">
                    <label class="input-label" for="id_cycle">Cycle</label>
                    <select name="cycle" class="input select" id="id_cycle">
                        <option value="">Tous les cycles</option>
                        {% for c in cycles %}
                        <option value="{{ c.pk }}" {% if type_doc.cycle_id == c.pk %}selected{% endif %}>{{ c.nom }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="input-label" for="id_libelle">Libellé <span style="color:#FF6B7A;">*</span></label>
                    <input type="text" name="libelle" value="{{ type_doc.libelle|default:'' }}" placeholder="Ex: Certificat de Scolarité" required class="input" id="id_libelle">
                </div>

                <div class="form-group">
                    <label class="input-label" for="id_categorie">Catégorie <span style="color:#FF6B7A;">*</span></label>
                    <select name="categorie" required class="input select" id="id_categorie">
                        <option value="SCOLARITE" {% if type_doc.categorie == 'SCOLARITE' %}selected{% endif %}>Scolarité</option>
                        <option value="FINANCE" {% if type_doc.categorie == 'FINANCE' %}selected{% endif %}>Finance</option>
                        <option value="ADMINISTRATIF" {% if type_doc.categorie == 'ADMINISTRATIF' %}selected{% endif %}>Administratif</option>
                        <option value="PEDAGOGIE" {% if type_doc.categorie == 'PEDAGOGIE' %}selected{% endif %}>Pédagogie</option>
                        <option value="PERSONNEL" {% if type_doc.categorie == 'PERSONNEL' %}selected{% endif %}>Personnel</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="input-label" for="id_description">Description</label>
                    <textarea name="description" rows="3" class="input" placeholder="Description du type de document..." id="id_description">{{ type_doc.description|default:'' }}</textarea>
                </div>

                {% if type_doc %}
                <label class="d-flex align-center gap-3" style="cursor:pointer;">
                    <input type="checkbox" name="actif" {% if type_doc.actif %}checked{% endif %} style="width:1rem; height:1rem; accent-color:var(--color-primary);">
                    <span class="text-sm text-secondary">Type de document actif</span>
                </label>
                {% endif %}

                <div class="modal-footer">
                    <button type="button" data-csp-remove="modal-overlay" class="btn-secondary">Annuler</button>
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </div>
            </div>
        </form>
    </div>
</div>
