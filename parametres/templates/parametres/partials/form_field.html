<div class="form-group{% if full_width %} form-grid-2-full{% endif %}">
    <label class="input-label" for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %}<span class="color-danger"> *</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}<p class="text-xs text-muted mt-2">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="input-error">{{ error }}</p>{% endfor %}
</div>
