<div id="liste-container" hx-trigger="parametreUpdated from:body" hx-get="{% url 'parametres:appreciation_primaire_list' %}" hx-target="#liste-container" hx-swap="outerHTML">
    <div class="table-scroll">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Libellé</th>
                    <th>Plage de moyennes</th>
                    <th>Couleur</th>
                    <th style="text-align:right;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for a in appreciations %}
                <tr>
                    <td class="fw-medium">
                        <span class="badge" style="background:{{ a.couleur }}20; color:{{ a.couleur }};">{{ a.libelle }}</span>
                    </td>
                    <td class="text-secondary">{{ a.moy_min }} — {{ a.moy_max }} / 10</td>
                    <td>
                        <div class="d-flex align-center gap-2">
                            <span style="display:inline-block; width:1rem; height:1rem; border-radius:var(--radius-sm); background:{{ a.couleur }};"></span>
                            <span class="text-xs text-mono text-muted">{{ a.couleur }}</span>
                        </div>
                    </td>
                    <td style="text-align:right;">
                        <div class="d-flex justify-end gap-2">
                            <button hx-get="{% url 'parametres:appreciation_primaire_edit' a.pk %}" hx-target="#modal-container" hx-swap="innerHTML"
                                class="btn-icon" title="Modifier">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                            <button hx-post="{% url 'parametres:appreciation_primaire_delete' a.pk %}"
                                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                                hx-confirm="Supprimer cette appréciation ?"
                                class="btn-icon" title="Supprimer" style="color:var(--color-danger);">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="4"><div class="empty-state"><p class="empty-state-text">Aucune appréciation. Créez la première.</p></div></td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
