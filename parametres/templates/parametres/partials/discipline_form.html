<div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title">{% if discipline %}Modifier la discipline{% else %}Nouvelle discipline{% endif %}</span>
            <button data-csp-remove="modal-overlay" class="btn-icon" aria-label="Fermer">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <form hx-post="{% if discipline %}{% url 'parametres:discipline_edit' discipline.pk %}{% else %}{% url 'parametres:discipline_create' %}{% endif %}"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              hx-target="#modal-container"
              hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                {% if error %}<div class="alert alert-danger mb-4">{{ error }}</div>{% endif %}

                <div class="form-group">
                    <label class="input-label">Nom <span style="color:#FF6B7A;">*</span></label>
                    <input type="text" name="nom" value="{{ discipline.nom|default:'' }}" placeholder="Ex: Mathématiques" required class="input">
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="input-label">Code <span style="color:#FF6B7A;">*</span></label>
                        <input type="text" name="code" value="{{ discipline.code|default:'' }}" placeholder="Ex: MATH" required class="input">
                    </div>
                    <div class="form-group">
                        <label class="input-label">Cycle <span style="color:#FF6B7A;">*</span></label>
                        <select name="cycle" required class="input select">
                            {% for cy in cycles %}<option value="{{ cy.pk }}" {% if discipline.cycle_id == cy.pk %}selected{% endif %}>{{ cy.nom }}</option>{% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="input-label">Catégorie</label>
                        <select name="categorie" class="input select">
                            <option value="">— Aucune —</option>
                            {% for cat in categories %}<option value="{{ cat.pk }}" {% if discipline.categorie_id == cat.pk %}selected{% endif %}>{{ cat.nom }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="input-label">Ordre</label>
                        <input type="number" name="ordre" value="{{ discipline.ordre|default:1 }}" min="1" class="input">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="input-label">Couleur</label>
                        <input type="color" name="couleur" value="{{ discipline.couleur|default:'#00A86B' }}"
                            style="width:100%; height:2.375rem; border-radius:var(--radius-sm); border:1px solid var(--color-border); background:var(--color-bg-input); cursor:pointer; padding:2px;">
                    </div>
                    <div></div>
                </div>

                <div class="d-flex align-center gap-6">
                    <label class="d-flex align-center gap-3" style="cursor:pointer;">
                        <input type="checkbox" name="est_evaluee" {% if discipline.est_evaluee or not discipline %}checked{% endif %}
                            style="width:1rem; height:1rem; accent-color:var(--color-primary);">
                        <span class="text-sm text-secondary">Matière évaluée</span>
                    </label>
                    {% if discipline %}
                    <label class="d-flex align-center gap-3" style="cursor:pointer;">
                        <input type="checkbox" name="actif" {% if discipline.actif %}checked{% endif %}
                            style="width:1rem; height:1rem; accent-color:var(--color-primary);">
                        <span class="text-sm text-secondary">Active</span>
                    </label>
                    {% endif %}
                </div>

                <div class="modal-footer">
                    <button type="button" data-csp-remove="modal-overlay" class="btn-secondary">Annuler</button>
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </div>
            </div>
        </form>
    </div>
</div>
