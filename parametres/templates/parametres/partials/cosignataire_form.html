<div style="padding:0;">
  <div class="modal-header" style="border-bottom:1px solid var(--color-border); padding:1rem 1.5rem;">
    <span class="modal-title">
      {% if cosig %}Modifier le co-signataire{% else %}Nouveau co-signataire{% endif %}
    </span>
    <button data-csp-action="close-modal-container" class="btn-icon" aria-label="Fermer">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <form hx-post="{% if cosig %}{% url 'parametres:cosignataire_edit' signataire.pk cosig.pk %}{% else %}{% url 'parametres:cosignataire_create' signataire.pk %}{% endif %}"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
        hx-target="#modal-content"
        hx-swap="innerHTML">
    {% csrf_token %}
    <div style="padding:1rem 1.5rem;">
      {% if error %}<div class="alert alert-danger mb-4">{{ error }}</div>{% endif %}

      <div class="form-group">
        <label class="input-label">Membre du personnel <span style="color:#FF6B7A;">*</span></label>
        <select name="membre_personnel" class="input select" required>
          <option value="">— Sélectionner —</option>
          {% for p in personnel %}
          <option value="{{ p.pk }}"
            {% if cosig and cosig.membre_personnel_id == p.pk %}selected{% endif %}>
            {{ p.nom }} {{ p.prenom }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label class="input-label">Fonction</label>
          <input type="text" name="fonction"
                 value="{{ cosig.fonction|default:'' }}"
                 placeholder="Ex: Le Censeur, Le Secrétaire Général"
                 class="input">
        </div>
        <div class="form-group">
          <label class="input-label">Ordre d'affichage</label>
          <input type="number" name="ordre"
                 value="{{ cosig.ordre|default:2 }}"
                 min="1" max="10" class="input">
        </div>
      </div>

      {% if cosig %}
      <label class="d-flex align-center gap-3" style="cursor:pointer; margin-bottom:1rem;">
        <input type="checkbox" name="actif" {% if cosig.actif %}checked{% endif %}
               style="width:1rem; height:1rem; accent-color:var(--color-primary);">
        <span class="text-sm text-secondary">Co-signataire actif</span>
      </label>
      {% endif %}

      <div class="d-flex justify-end gap-2" style="padding-top:0.5rem;">
        <button type="button"
                hx-get="{% url 'parametres:cosignataire_list' signataire.pk %}"
                hx-target="#modal-content"
                hx-swap="innerHTML"
                class="btn-secondary">Annuler</button>
        <button type="submit" class="btn-primary">Enregistrer</button>
      </div>
    </div>
  </form>
</div>
