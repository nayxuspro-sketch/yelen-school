<div id="modal-overlay" class="modal-overlay">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title" style="max-width:36rem; max-height:90vh; overflow-y:auto;">
        <div class="modal-header">
            <span class="modal-title" id="modal-title">{% if classe %}Modifier la classe{% else %}Nouvelle classe{% endif %}</span>
            <button data-csp-remove="modal-overlay" class="btn-icon" aria-label="Fermer">
                <svg aria-hidden="true" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <form hx-post="{% if classe %}{% url 'parametres:classe_edit' classe.pk %}{% else %}{% url 'parametres:classe_create' %}{% endif %}"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              hx-target="#modal-container"
              hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="input-label" for="id_nom">Nom <span style="color:#FF6B7A;">*</span></label>
                        <input type="text" name="nom" value="{{ classe.nom|default:'' }}" placeholder="Ex: 6ème A" required class="input" id="id_nom">
                    </div>
                    <div class="form-group">
                        <label class="input-label" for="id_niveau">Niveau <span style="color:#FF6B7A;">*</span></label>
                        <input type="text" name="niveau" value="{{ classe.niveau|default:'' }}" placeholder="Ex: 6ème" required class="input" id="id_niveau">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label class="input-label" for="id_cycle">Cycle <span style="color:#FF6B7A;">*</span></label>
                        <select name="cycle" required class="input select" id="id_cycle">
                            {% for cy in cycles %}<option value="{{ cy.pk }}" {% if classe.cycle_id == cy.pk %}selected{% endif %}>{{ cy.nom }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="input-label" for="id_capacite_max">Capacité max</label>
                        <input type="number" name="capacite_max" value="{{ classe.capacite_max|default:50 }}" min="1" max="200" class="input" id="id_capacite_max">
                    </div>
                </div>

                <label class="d-flex align-center gap-3 mb-4" style="cursor:pointer;" for="id_type_examen">
                    <input type="checkbox" name="est_classe_examen" id="est-exam" {% if classe.est_classe_examen %}checked{% endif %}
                        style="width:1rem; height:1rem; accent-color:var(--color-primary);"
                        data-csp-toggle-target="exam-fields">
                    <span class="text-sm text-secondary">Classe d'examen officiel (CEP / BEPC / BAC)</span>
                </label>

                <div id="exam-fields" class="form-grid-2" style="{% if not classe.est_classe_examen %}display:none;{% endif %}">
                    <div class="form-group">
                        <label class="input-label">Type d'examen</label>
                        <select name="type_examen" class="input select" id="id_type_examen">
                            <option value="">—</option>
                            {% for val, label in type_examen_choices %}<option value="{{ val }}" {% if classe.type_examen == val %}selected{% endif %}>{{ label }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="input-label" for="id_serie_bac">Série BAC</label>
                        <select name="serie_bac" class="input select" id="id_serie_bac">
                            <option value="">—</option>
                            {% for val, label in serie_bac_choices %}<option value="{{ val }}" {% if classe.serie_bac == val %}selected{% endif %}>{{ label }}</option>{% endfor %}
                        </select>
                    </div>
                </div>

                {% if classe %}
                <label class="d-flex align-center gap-3" style="cursor:pointer;">
                    <input type="checkbox" name="actif" {% if classe.actif %}checked{% endif %}
                        style="width:1rem; height:1rem; accent-color:var(--color-primary);">
                    <span class="text-sm text-secondary">Classe active</span>
                </label>
                {% endif %}

                <div class="modal-footer">
                    <button type="button" data-csp-remove="modal-overlay" class="btn-secondary">Annuler</button>
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </div>
            </div>
        </form>
    </div>
</div>
