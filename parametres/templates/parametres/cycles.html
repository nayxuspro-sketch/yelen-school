{% extends 'core/base.html' %}

{% block title %}Cycles — Paramètres{% endblock %}

{% block content %}
<div class="page-header animate-fade-up">
    <div>
        <p class="page-subtitle">
            <a href="{% url 'parametres:index' %}" class="text-secondary">Paramètres</a>
            <span class="text-muted"> / </span>
            <span>Cycles</span>
        </p>
        <h1 class="page-title">Cycles scolaires</h1>
    </div>
    <div class="d-flex gap-2">
        <button hx-get="{% url 'parametres:cycle_create' %}" hx-target="#modal-container" hx-swap="innerHTML"
            class="btn-primary">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Nouveau cycle
        </button>
    </div>
</div>

<div id="modal-container"></div>

{% include 'parametres/partials/cycle_tree.html' %}
<script>
function toggleCycle(header) {
    const content = header.nextElementSibling;
    const chevron = header.querySelector('.cycle-chevron');
    if (content.style.display === 'none') {
        content.style.display = 'block';
        chevron.style.transform = 'rotate(90deg)';
    } else {
        content.style.display = 'none';
        chevron.style.transform = 'rotate(0deg)';
    }
}
</script>

<style>
.cycle-header:hover { opacity: 0.95; }
</style>
{% endblock %}
