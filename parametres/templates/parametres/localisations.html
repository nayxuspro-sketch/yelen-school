{% extends 'core/base.html' %}

{% block title %}Localisations — Paramètres{% endblock %}

{% block content %}
<div class="page-header animate-fade-up">
  <div>
    <p class="page-subtitle">
      <a href="{% url 'parametres:index' %}" class="text-secondary">Paramètres</a>
      <span class="text-muted"> / </span>
      <span>Localisations</span>
    </p>
    <h1 class="page-title">Localisations de postes</h1>
  </div>
  <button hx-get="{% url 'parametres:localisation_create' %}"
          hx-target="#modal-container"
          hx-swap="innerHTML"
          class="btn-primary">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
    </svg>
    Nouvelle localisation
  </button>
</div>

<div id="modal-container"></div>

<div class="table-wrapper animate-fade-up delay-1"
     hx-get="{% url 'parametres:localisation_list' %}"
     hx-trigger="parametreUpdated from:body"
     hx-target="this"
     hx-swap="innerHTML">
  {% include 'parametres/partials/localisation_list.html' %}
</div>
{% endblock %}
