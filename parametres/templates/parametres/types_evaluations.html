{% extends 'core/base.html' %}

{% block title %}Types d'évaluation — Paramètres{% endblock %}

{% block content %}
<div class="page-header animate-fade-up">
  <div>
    <p class="page-subtitle">
      <a href="{% url 'parametres:index' %}" class="text-secondary">Paramètres</a>
      <span class="text-muted"> / </span>
      <span>Types d'évaluation</span>
    </p>
    <h1 class="page-title">Types d'évaluation</h1>
  </div>
  <button type="button"
          hx-get="{% url 'parametres:type_evaluation_create' %}"
          hx-target="#modal-container" hx-swap="innerHTML"
          class="btn-primary">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
    </svg>
    Nouveau type
  </button>
</div>

<div id="modal-container"></div>

<div id="type-evaluation-table" class="table-wrapper animate-fade-up delay-1">
  {% include 'parametres/partials/type_evaluation_list.html' %}
</div>
{% endblock %}
