{% extends "core/base.html" %}

{% block title %}Supprimer la salle — YELEN SCHOOL{% endblock %}

{% block content %}

<div class="page-header animate-fade-up">
  <h1 class="page-title">Supprimer une salle</h1>
</div>

<div class="card animate-fade-up delay-1" style="max-width:480px;">
  <div class="card-body">
    <p class="mb-4">
      Êtes-vous sûr de vouloir supprimer la salle
      <strong>{{ salle.nom }}</strong> du centre {{ salle.centre.nom }} ?
    </p>
    <form method="post" class="d-flex gap-3">
      {% csrf_token %}
      <button type="submit" class="btn-danger">Confirmer la suppression</button>
      <a href="{% url 'examens:session_detail' salle.centre.session.pk %}" class="btn-secondary">Annuler</a>
    </form>
  </div>
</div>

{% endblock %}
