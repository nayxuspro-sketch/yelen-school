{% load static static_v %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erreur serveur — YELEN SCHOOL</title>
  <link rel="stylesheet" href="{% static_v 'css/yelen.css' %}">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--color-bg); }
    .error-card {
      text-align: center;
      padding: 3rem 4rem;
      background: var(--color-bg-card);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      max-width: 480px;
      width: 90%;
    }
    .error-code { font-size: 6rem; font-weight: 800; color: #ef4444; line-height: 1; margin-bottom: 0.5rem; }
    .error-title { font-size: 1.5rem; font-weight: 700; color: var(--color-text); margin-bottom: 0.75rem; }
    .error-msg { color: var(--color-text-muted); margin-bottom: 2rem; line-height: 1.6; }
    .error-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">500</div>
    <div class="error-title">Erreur interne du serveur</div>
    <p class="error-msg">
      Une erreur inattendue s'est produite. Veuillez réessayer ou contacter l'administrateur si le problème persiste.
    </p>
    <div class="error-actions">
      <a href="javascript:history.back()" class="btn btn-secondary">← Retour</a>
      <a href="/" class="btn btn-primary">Accueil</a>
    </div>
  </div>
</body>
</html>
