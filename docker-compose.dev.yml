services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
    depends_on:
      - web

  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      HOST_LAN_IP: ${HOST_LAN_IP:-}
    # devices:  # Décommenter quand le modem GSM est branché
      # - /dev/ttyUSB0:/dev/ttyUSB0   # Modem GSM USB (Huawei, ZTE…)
      # - /dev/ttyACM0:/dev/ttyACM0   # Alternative selon le modèle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; exit(0 if u.urlopen('http://localhost:8000/', timeout=5).getcode() in [200,301,302,401,403] else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  db:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: yelen_school_db
      POSTGRES_USER: yelen_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yelen_user -d yelen_school_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: yelenaccess
      MINIO_ROOT_PASSWORD: yelensecret
    ports:
      - "9000:9000"
      - "9001:9001"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"

volumes:
  postgres_data:
