<div id="notifications-header"
     class="page-header animate-fade-up"
     hx-trigger="notificationsUpdated from:body"
     hx-get="{% url 'core:notifications_list' %}?_partial=header"
     hx-target="#notifications-header"
     hx-swap="outerHTML">
  <div>
    <p class="page-subtitle">Espace personnel</p>
    <h1 class="page-title">Notifications
      {% if nb_non_lues %}<span class="badge badge-danger" style="font-size:0.75rem; margin-left:8px;">{{ nb_non_lues }}</span>{% endif %}
    </h1>
  </div>
  {% if nb_non_lues %}
  <a href="{% url 'core:notifications_tout_lu' %}" class="btn-outline">
    Tout marquer comme lu
  </a>
  {% endif %}
</div>
