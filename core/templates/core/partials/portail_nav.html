{# Navigation basse des portails parent et élève (URL via « portail ») — paramètre « actif » : accueil | vie_scolaire | bulletins | notifs #}
<nav class="pp-nav">
  <a href="{% url portail.accueil %}" class="pp-nav-item{% if actif == 'accueil' %} pp-nav-item--active{% endif %}">
    <span class="pp-nav-icon">
      <svg aria-hidden="true" width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </span>
    Accueil
  </a>
  <a href="{% url portail.vie_scolaire %}" class="pp-nav-item{% if actif == 'vie_scolaire' %} pp-nav-item--active{% endif %}">
    <span class="pp-nav-icon">
      <svg aria-hidden="true" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
    </span>
    Vie scol.
  </a>
  <a href="{% url portail.bulletins %}" class="pp-nav-item{% if actif == 'bulletins' %} pp-nav-item--active{% endif %}">
    <span class="pp-nav-icon">
      <svg aria-hidden="true" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
    </span>
    Bulletins
  </a>
  <a href="{% url portail.notifications %}" class="pp-nav-item{% if actif == 'notifs' %} pp-nav-item--active{% endif %}">
    <span class="pp-nav-icon">
      <svg aria-hidden="true" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
      </svg>
    </span>
    Notifs
  </a>
  <form method="post" action="{% url 'accounts:logout' %}" style="margin:0;">
    {% csrf_token %}
    <button type="submit" class="pp-nav-item pp-nav-item--danger" style="width:100%; border:none; cursor:pointer; font-family:inherit; font-size:inherit;">
      <span class="pp-nav-icon">
        <svg aria-hidden="true" width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
      </span>
      Quitter
    </button>
  </form>
</nav>
