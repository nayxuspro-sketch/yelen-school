# Distribution locale YELEN SCHOOL
# PostgreSQL et Redis sont gérés localement par Docker.
# Les données persistantes sont conservées dans des volumes nommés.

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-yelen_school_db}
      POSTGRES_USER: ${DB_USER:-yelen_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}
    volumes:
      - yelen_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yelen_user} -d ${DB_NAME:-yelen_school_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - yelen_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    image: yelen-school:client
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${YELEN_HTTP_PORT:-8000}:8000"
    volumes:
      - yelen_media:/app/media
      - yelen_staticfiles:/app/staticfiles
      - yelen_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; r = u.urlopen('http://localhost:8000/accounts/login/', timeout=5); exit(0 if r.status in [200, 301, 302, 403] else 1)\""]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  yelen_postgres_data:
  yelen_redis_data:
  yelen_media:
  yelen_staticfiles:
  yelen_logs:
