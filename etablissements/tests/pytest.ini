[pytest]
DJANGO_SETTINGS_MODULE = yelen_school.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html:htmlcov
    --cov-fail-under=80
markers =
    slow: Tests lents (génération PDF, etc.)
    integration: Tests d'intégration multi-modules
    licence: Tests du module licences
    matricule: Tests de génération matricules BF- et PERS-
    age_calcule: Tests du calcul dynamique de l'âge
