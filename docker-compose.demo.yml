# Instance de démonstration publique — offre hébergée optionnelle (chantier B8)
#
#   docker compose -f docker-compose.demo.yml up -d --build
#
# Même image que l'installation d'une école (Dockerfile), comportement propre à la démonstration :
#   - DEMO_MODE=true  : aucune sortie vers l'extérieur (SMS, e-mail, push, Mobile Money), bandeau
#                       « DÉMONSTRATION » sur toutes les pages, /health/ expose "demo": true ;
#   - base SQLite dans un volume (comme le mode autonome) : la remise à zéro nocturne supprime et recharge
#     l'établissement, ce qu'un historique financier PostgreSQL immuable interdirait ;
#   - service `reset` : `docker compose -f docker-compose.demo.yml run --rm reset` (cron nocturne).
#
# Variables attendues dans .env.demo : SECRET_KEY, ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, YELEN_HTTP_PORT.

services:
  web:
    image: ${YELEN_IMAGE:-yelen-school:demo}
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["./entrypoint.demo.sh"]
    env_file:
      - .env.demo
    environment:
      DB_ENGINE: sqlite
      SQLITE_PATH: /app/data/yelen_demo.sqlite3
      CACHE_BACKEND: database
      DEMO_MODE: "true"
      LICENSE_ENFORCEMENT: "false"
      DISABLE_HTTPS_REDIRECT: "true"
    ports:
      - "${YELEN_HTTP_PORT:-8001}:8000"
    volumes:
      - yelen_demo_data:/app/data
      - yelen_demo_media:/app/media
      - yelen_demo_staticfiles:/app/staticfiles
      - yelen_demo_logs:/app/logs
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; r = u.urlopen('http://localhost:8000/health/', timeout=5); exit(0 if r.status == 200 else 1)\""]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # Remise à zéro du jeu de démonstration (quatre heures du matin, par le cron de l'hébergeur) :
  #   0 4 * * *  cd /srv/yelen-demo && docker compose -f docker-compose.demo.yml run --rm reset
  reset:
    image: ${YELEN_IMAGE:-yelen-school:demo}
    profiles: ["reset"]
    entrypoint: ["python", "manage.py", "reinitialiser_demo"]
    env_file:
      - .env.demo
    environment:
      DB_ENGINE: sqlite
      SQLITE_PATH: /app/data/yelen_demo.sqlite3
      CACHE_BACKEND: database
      DEMO_MODE: "true"
      LICENSE_ENFORCEMENT: "false"
    volumes:
      - yelen_demo_data:/app/data
    depends_on:
      web:
        condition: service_healthy

volumes:
  yelen_demo_data:
  yelen_demo_media:
  yelen_demo_staticfiles:
  yelen_demo_logs:
