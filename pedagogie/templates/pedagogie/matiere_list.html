{% extends "core/base.html" %}

{% block title %}Matières — YELEN SCHOOL{% endblock %}

{% block content %}

<div class="page-header animate-fade-up">
  <div>
    <h1 class="page-title">Référentiel des Matières</h1>
    <p class="page-subtitle">Configurez les matières enseignées dans l'établissement.</p>
  </div>
  <a href="{% url 'pedagogie:matiere_create' %}" class="btn-primary">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
    </svg>
    Nouvelle matière
  </a>
</div>

<div class="card mb-4 animate-fade-up delay-1" style="padding:var(--space-4);">
  <div class="search-wrapper">
    <span class="search-icon">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
    </span>
    <input type="text"
           name="q"
           class="input search-input"
           placeholder="Rechercher par nom ou code..."
           hx-get="{% url 'pedagogie:matiere_list' %}"
           hx-trigger="keyup changed delay:500ms"
           hx-target="#matiere-table"
           value="{{ query }}">
  </div>
</div>

<div id="matiere-table" class="table-wrapper animate-fade-up delay-2">
  {% include "pedagogie/partials/matiere_table.html" %}
</div>

{% endblock %}
