<option value="">-- Sélectionner une matière --</option>
{% for matiere in matieres %}
<option value="{{ matiere.pk }}">{{ matiere.code }} — {{ matiere.nom }}</option>
{% empty %}
  {% if cycle_selectionne %}
<option value="" disabled>Aucune matière configurée pour ce cycle</option>
  {% else %}
<option value="" disabled>Sélectionnez d’abord une classe</option>
  {% endif %}
{% endfor %}

<select id="id_personnel" hx-swap-oob="innerHTML">
<option value="">-- Sélectionner un enseignant --</option>
{% for enseignant in enseignants %}
<option value="{{ enseignant.pk }}">{{ enseignant.get_nom_complet }}</option>
{% empty %}
  {% if liste_limitee_a_la_classe %}
<option value="" disabled>Aucun enseignant associé à cette classe</option>
  {% elif cycle_selectionne %}
<option value="" disabled>Aucun personnel actif dans l’établissement</option>
  {% else %}
<option value="" disabled>Sélectionnez d’abord une classe</option>
  {% endif %}
{% endfor %}
</select>
