# A7 — Sécurisation logs nginx : ne jamais logger Authorization / tokens
# - log_format custom sans $http_authorization
# - access_log avec filtre : on ne log pas les requêtes API avec token en clair
# - Les tokens DRF transitent dans Authorization: Token <valeur> — ils ne doivent JAMAIS apparaître en clair dans les logs

log_format yelen_combined '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';

# Map pour détecter les requêtes avec Authorization (API) — on peut les logger sans header
map $http_authorization $loggable {
    default 1;
    # Si besoin, on pourrait désactiver le log pour certaines routes très sensibles :
    # "~*Token" 0;  # Décommenter pour ne PAS logger du tout les requêtes avec token
}

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/yelen.crt;
    ssl_certificate_key /etc/nginx/certs/yelen.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    client_max_body_size 20M;

    # A7 : utiliser le format sécurisé (sans Authorization)
    access_log /var/log/nginx/access.log yelen_combined;
    error_log  /var/log/nginx/error.log warn;

    # Sécurité : ne jamais exposer les headers sensibles dans les logs d'erreur
    # (nginx ne log pas Authorization par défaut, mais on le documente explicitement)

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;

        # A7 : ne pas propager Authorization dans les logs applicatifs si possible
        # Le backend Django ne doit pas logger request.META['HTTP_AUTHORIZATION'] en clair
        # (vérifié dans yelen_school/settings.py LOGGING — pas de log des headers)
    }
}
