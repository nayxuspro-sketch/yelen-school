# Les champs Authorization et la query string ne sont pas inclus dans ce
# format de log : les tokens API/webhook ne doivent jamais apparaître.
log_format yelen_access '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log yelen_access;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    access_log /var/log/nginx/access.log yelen_access;

    ssl_certificate     /etc/nginx/certs/yelen.crt;
    ssl_certificate_key /etc/nginx/certs/yelen.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
