{% extends "core/base.html" %}

{% block title %}{{ titre }} — YELEN SCHOOL{% endblock %}

{% block content %}

<div class="page-header animate-fade-up">
  <div class="d-flex align-center gap-4">
    <a href="/licences/" class="btn-icon">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
    </a>
    <h1 class="page-title">{{ titre }}</h1>
  </div>
</div>

<div class="card animate-fade-up delay-1" style="max-width:480px;">
  <div style="padding:var(--space-6);">
    <p style="font-size:0.9rem; color:var(--color-text); line-height:1.6; margin-bottom:var(--space-6);">
      {{ message }}
    </p>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-3">
        <button type="submit" class="{{ btn_class }}">{{ btn_label }}</button>
        <a href="/licences/" class="btn-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
